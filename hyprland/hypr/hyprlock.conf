general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/autumn-landscape-4.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    color = rgb(24273a)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(cad3f5)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(b8c0e0)
    font_size = 18
    position = 0, 140
    halign = center
    valign = center
}

image {
    monitor =
    path = /var/lib/AccountsService/icons/eosorio
    size = 110
    rounding = -1
    border_size = 3
    border_color = rgb(b7bdf8)
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = $DESC
    color = rgb(cad3f5)
    font_size = 20
    position = 0, -60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    rounding = 14
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    inner_color = rgb(363a4f)
    outer_color = rgb(b7bdf8)
    font_color = rgb(cad3f5)
    check_color = rgb(eed49f)
    fail_color = rgb(ed8796)
    fail_text = Contraseña incorrecta
    placeholder_text = <span foreground="##a5adcb">󰌾  Contraseña</span>
    position = 0, -130
    halign = center
    valign = center
}
