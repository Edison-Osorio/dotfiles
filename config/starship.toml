"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_base)\
$os\
$username\
[](fg:color_base bg:color_blue)\
$directory\
[](fg:color_blue bg:color_aqua)\
$git_branch\
$git_status\
[](fg:color_aqua bg:color_green)\
$python\
$nodejs\
$docker_context\
[](fg:color_green)\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
color_base    = '#1e1e2e'
color_blue    = '#89b4fa'
color_aqua    = '#94e2d5'
color_green   = '#a6e3a1'
color_yellow  = '#f9e2af'
color_red     = '#f38ba8'
color_mauve   = '#cba6f7'
color_text    = '#cdd6f4'
color_subtext = '#a6adc8'

[os]
disabled = false
style = "bg:color_base fg:color_mauve"
[os.symbols]
Linux = "󰌽 "

[username]
show_always = true
style_user  = "bg:color_base fg:color_text"
style_root  = "bg:color_base fg:color_red"
format      = '[ $user ]($style)'

[directory]
style            = "fg:color_base bg:color_blue bold"
format           = "[ 󰉋 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = "󰝚 "
"Pictures"  = " "
"src"       = "󰲋 "

[git_branch]
symbol = ""
style  = "bg:color_aqua fg:color_base"
format = '[ $symbol $branch ]($style)'

[git_status]
style  = "bg:color_aqua fg:color_base"
format = '[$all_status$ahead_behind ]($style)'

[python]
symbol           = " "
style            = "bg:color_green fg:color_base bold"
format           = '[ $symbol$version(\($virtualenv\)) ]($style)'
detect_extensions = ['py']
detect_files     = ['pyproject.toml', 'Pipfile', '.python-version', 'requirements.txt']

[nodejs]
symbol           = " "
style            = "bg:color_green fg:color_base bold"
format           = '[ $symbol$version ]($style)'
detect_extensions = ['js', 'ts', 'mjs', 'cjs']
detect_files     = ['package.json', 'tsconfig.json']

[docker_context]
symbol = "󰡨 "
style  = "bg:color_green fg:color_base bold"
format = '[ $symbol$context ]($style)'
only_with_files = true

[fill]
symbol = " "

[cmd_duration]
min_time = 2000
style    = "fg:color_yellow"
format   = "[ 󱎫 $duration ]($style)"

[time]
disabled  = false
style     = "fg:color_subtext"
format    = "[ 󰥔 $time ]($style)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold fg:color_green)"
error_symbol   = "[❯](bold fg:color_red)"
