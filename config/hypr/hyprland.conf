################
### MONITORS ###
################

source = ~/.config/hypr/monitors.conf
monitor=,preferred,auto,1

#####################
### WORKSPACES    ###
#####################

workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:DP-1, default:true
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1

###################
### AUTOSTART   ###
###################

exec-once = /usr/bin/lxqt-policykit-agent
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = waybar
exec-once = dunst
exec-once = swww-daemon
exec-once = sleep 1 && swww img --outputs eDP-1 ~/.local/share/wallpapers/wallpaper.png && swww img --outputs DP-1 ~/.local/share/wallpapers/wallpaper.png
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = sleep 1 && /usr/libexec/xdg-desktop-portal-hyprland
exec-once = sleep 2 && /usr/libexec/xdg-desktop-portal
exec-once = ~/.config/hypr/scripts/monitor-events.sh

#################
### VARIABLES ###
#################

$terminal = kitty
$fileManager = nautilus
$menu = wofi --show drun

# Catppuccin Mocha
$rosewater = rgb(f5e0dc)
$flamingo  = rgb(f2cdcd)
$pink      = rgb(f5c2e7)
$mauve     = rgb(cba6f7)
$red       = rgb(f38ba8)
$maroon    = rgb(eba0ac)
$peach     = rgb(fab387)
$yellow    = rgb(f9e2af)
$green     = rgb(a6e3a1)
$teal      = rgb(94e2d5)
$sky       = rgb(89dceb)
$sapphire  = rgb(74c7ec)
$blue      = rgb(89b4fa)
$lavender  = rgb(b4befe)
$text      = rgb(cdd6f4)
$subtext1  = rgb(bac2de)
$subtext0  = rgb(a6adc8)
$overlay2  = rgb(9399b2)
$overlay1  = rgb(7f849c)
$overlay0  = rgb(6c7086)
$surface2  = rgb(585b70)
$surface1  = rgb(45475a)
$surface0  = rgb(313244)
$base      = rgb(1e1e2e)
$mantle    = rgb(181825)
$crust     = rgb(11111b)

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $mauve $blue 45deg
    col.inactive_border = $surface1
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1e1e2e99)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.0117
        contrast = 0.9
        brightness = 0.8
        vibrancy = 0.1696
        new_optimizations = true
        xray = false
    }
}

animations {
    enabled = true

    bezier = easeOut,    0.16, 1,    0.3,  1
    bezier = easeInOut,  0.87, 0,    0.13, 1
    bezier = overshoot,  0.05, 0.9,  0.1,  1.05
    bezier = smoothOut,  0.5,  0,    1,    1

    animation = windows,     1, 5,  overshoot, slide
    animation = windowsOut,  1, 4,  smoothOut, slide
    animation = windowsMove, 1, 5,  easeInOut
    animation = border,      1, 10, default
    animation = borderangle, 1, 8,  default
    animation = fade,        1, 5,  easeOut
    animation = workspaces,  1, 5,  easeInOut, slidefadevert
    animation = specialWorkspace, 1, 5, easeInOut, slidefadevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

gestures {
    workspace_swipe_distance = 300
}

#############
### INPUT ###
#############

input {
    kb_layout = latam
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

####################
### WINDOW RULES ###
####################

# Wofi con blur
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, dunst
layerrule = ignorezero, dunst

# Wofi dmenu: foco inmediato para que el primer clic seleccione
windowrulev2 = stayfocused, class:^(wofi)$
windowrulev2 = float, class:^(wofi)$
windowrulev2 = center, class:^(wofi)$

# Floating
windowrule = float, class:^(nm-connection-editor)$
windowrule = center, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(Redes WiFi)$
windowrulev2 = center, title:^(Redes WiFi)$
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = center, class:^(pavucontrol)$
windowrule = center, class:^(blueman-manager)$
windowrule = size 800 500, class:^(pavucontrol)$

# Kitty: ligera transparencia de fondo ya en kitty.conf

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Tapa del portátil
bindl=,switch:on:Lid Switch,exec,~/.config/hypr/scripts/lid-close.sh
bindl=,switch:off:Lid Switch,exec,~/.config/hypr/scripts/lid-open.sh

# Aplicaciones
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, M,      exec, ~/.config/hypr/scripts/monitor-menu.sh
bind = $mainMod, W,      exec, wofi --show window
bind = $mainMod, Escape, exec, wlogout -p layer-shell
bind = $mainMod SHIFT, R, exec, pkill waybar; waybar &
bind = $mainMod, Space, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, brave-browser

# Alt+Tab
bind = ALT, Tab,       cyclenext
bind = ALT, Tab,       bringactivetotop
bind = ALT SHIFT, Tab, cyclenext,       prev
bind = ALT SHIFT, Tab, bringactivetotop

# Ventanas
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, Space, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit

# Foco con flechas
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Foco con hjkl
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Workspaces 1-9
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover ventana a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Workspace especial (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll entre workspaces con rueda del ratón
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Mover/redimensionar con ratón
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Captura de pantalla (requiere grim + slurp + wl-copy)
# Print        → pantalla completa, guarda archivo
# Ctrl+Print   → pantalla completa, directo al portapapeles
# Super+Shift+S → región seleccionada, guarda archivo Y copia al portapapeles
bind = , Print,           exec, grim ~/Imágenes/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = CTRL, Print,       exec, grim - | wl-copy
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | tee ~/Imágenes/screenshot-$(date +%Y%m%d-%H%M%S).png | wl-copy

# Audio
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brillo
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Playerctl
bindel = , XF86AudioNext,  exec, playerctl next
bindel = , XF86AudioPrev,  exec, playerctl previous
bindel = , XF86AudioPlay,  exec, playerctl play-pause
